<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header align="center">
        <h1>ABC College Admission 2026</h1>
    </header>
    <main>
        <h2>Courses and Fees</h2>

        <table border="1" cellspacing="0" padding="10" width="100%" margin="10" >
            <caption>Available Courses</caption>
            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>


            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>


            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>

        </table>
        <br>


        <form action="submit.php" method="post">
            <fieldset>
                <legend>Application Form</legend>
                <label for="student">Name:</label>
                <input type="text" id="student" name="name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="course">Course:</label>
                <br>
                <select id="course" name="course">
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select>
                <br><br>

                <label for="statement">Statement:</label>
                <br>
                <textarea id="statement" name="statement" rows="4"></textarea>


                <p><button type="submit">Apply</button></p>
            </fieldset>
        </form>
    </main>
    <footer align="center">
        <p>&copy; 2026 ABC College</p>
</body>
</html>
