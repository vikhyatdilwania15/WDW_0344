<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <form>
        <label for="course">Course:</label>

        </select>
        <br><br>

        <label for="feedback">Feedback:</label>

        <button type="submit">
            Submit
        </button>

        <button type="reset">
            Reset

        <button type="button" onclick="alert('Button clicked!')">
            Click Me
        </button>




     </form>
</body>
</html>
